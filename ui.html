<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Design History Log</title>
  <style>
    :root { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; color-scheme: light dark; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--figma-color-bg, #fff); color: var(--figma-color-text, #1b1e23); }
    header { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 12px; border-bottom: 1px solid var(--figma-color-border, #e6e7eb); }
    h1 { font-size: 17px; line-height: 24px; margin: 0; font-weight: 650; }
    button { cursor: pointer; font: inherit; border: 0; background: transparent; }
    button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--figma-color-border-brand, #386cf5); outline-offset: 2px; }
    .secondary { color: var(--figma-color-text-secondary, #767985); }
    .tiny { font-size: 11px; }
    .timestamp { font-family: "JetBrains Mono", "Roboto Mono", monospace; font-weight: 400; }
    .link { color: var(--figma-color-text-brand, #2469e8); padding: 4px; }
    main { padding: 18px 20px 24px; }
    textarea, input, select { color: inherit; font: inherit; border-radius: 7px; padding: 10px 12px; border: 1px solid var(--figma-color-border, #dadee4); background: var(--figma-color-bg, #fff); }
    .filter { display: flex; gap: 8px; margin-bottom: 13px; }
    .filter input { flex: 1; min-width: 0; }
    .filter select { width: 135px; }
    .entry { padding: 14px 0; border-bottom: 1px solid var(--figma-color-border, #e6e7eb); }
    .meta { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; line-height: 18px; margin-bottom: 7px; }
    .author { font-weight: 650; }
    .tag { font-size: 11px; font-weight: 650; border-radius: 4px; padding: 2px 6px; background: var(--figma-color-bg-secondary, #f1f3f5); }
    .markdown { line-height: 1.6; overflow-wrap: anywhere; }
    .markdown p { margin: 0 0 4px; white-space: pre-wrap; }
    .markdown ul, .markdown ol { margin: 3px 0 7px; padding-left: 22px; }
    .markdown li { margin: 2px 0; white-space: pre-wrap; }
    .markdown a { color: var(--figma-color-text-brand, #2469e8); text-decoration: underline; }
    .entry-actions { display:flex; align-items:center; gap:16px; margin-top:8px; }
    .edit-link, .delete-link { padding:0; font-size:12px; }
    .edit-link { color:var(--figma-color-text-brand,#2469e8); }
    .delete-link { color:var(--figma-color-text-danger,#c93635); }
    .delete-confirmation { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:10px; }
    .delete-confirmation .secondary-btn, .delete-confirmation .danger-primary { padding:6px 10px; }
    .handoff { padding: 12px; margin-top: 4px; font-weight: 650; background: var(--figma-color-bg-secondary, #f1f3f5); border-radius: 6px; }
    .footer { display: flex; align-items: center; justify-content: space-between; margin-top: 15px; gap: 10px; }
    .empty { text-align: center; color: var(--figma-color-text-secondary, #697080); padding: 40px 20px; }
    .secondary-btn { padding: 9px 12px; border: 1px solid var(--figma-color-border, #e3e4e8); border-radius: 7px; }
    .primary { padding: 10px 14px; background: var(--figma-color-bg-brand, #2469e8); color: var(--figma-color-text-onbrand, white); border-radius: 7px; font-weight: 650; }
    .buttons { display: flex; justify-content: space-between; gap: 8px; margin-top: 14px; }
    .editor-header { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:8px; }
    .editor-header label { margin:0; }
    .help-icon { width:20px; height:20px; border-radius:50%; border:1px solid var(--figma-color-border, #b9bdc4); font-size:12px; color:var(--figma-color-text-secondary,#697080); }
    .danger { color:var(--figma-color-text-danger,#c93635); padding:9px 0; }
    .danger-primary { background:var(--figma-color-bg-danger,#b91c1c); color:white; padding:10px 14px; border-radius:7px; font-weight:650; }
    #editor { display: none; }
    #editor.active { display: block; }
    #history.hidden { display: none; }
    label { display: block; font-size: 12px; font-weight: 600; margin: 0 0 8px; }
    textarea { width: 100%; resize: vertical; min-height: 170px; line-height: 1.5; }
    #error { min-height: 17px; color: var(--figma-color-text-danger, #c93635); font-size: 12px; margin-top: 10px; }
    details { color: var(--figma-color-text-secondary, #697080); font-size: 11px; margin-top: 10px; }
    summary { cursor: pointer; }
    details code { color: var(--figma-color-text, #17191d); }
  </style>
</head>
<body>
  <header><div><h1>Вся история изменений</h1><div id="total" class="secondary tiny">Загрузка записей…</div></div><button class="link" id="close" aria-label="Закрыть">Закрыть</button></header>
  <main>
    <section id="history">
      <div class="filter">
        <input id="search" placeholder="Поиск по истории" aria-label="Поиск по истории" />
        <select id="typeFilter" aria-label="Категория">
          <option value="all">Все записи</option>
          <option value="added">Added</option>
          <option value="changed">Changed</option>
          <option value="fixed">Fixed</option>
          <option value="handoff">Передано</option>
        </select>
      </div>
      <div id="counter" class="secondary tiny"></div><div id="list"></div><div id="pageFooter" class="footer"></div>
    </section>
    <section id="editor">
      <div class="editor-header"><label for="editText">Редактирование записи</label><button type="button" class="help-icon" aria-label="Подсказка по форматированию"
        title="**текст** — жирный&#10;[название](https://…) — ссылка&#10;https://… — автоматическая ссылка&#10;- пункт — список&#10;1. пункт — нумерация">?</button></div>
      <textarea id="editText" maxlength="5000" aria-describedby="saveHint"></textarea>
      <div class="secondary tiny" id="saveHint">Изменения сохраняются при выходе из поля</div>
      <div class="buttons"><button id="cancelEdit" class="secondary-btn" type="button">Отмена</button></div>
    </section>
    <div id="error" role="status" aria-live="polite"></div>
  </main>
<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  let records = [];
  let page = 0;
  let editing = null;
  let submitted = false;
  let originalText = '';
  let preventBlurSave = false;
  let pendingDelete = false;
  let deleting = null;
  const pageSize = 40;
  const send = (message) => parent.postMessage({ pluginMessage: message }, '*');
  const tag = (name, className = '', text = '') => {
    const node = document.createElement(name);
    if (className) node.className = className;
    node.textContent = text;
    return node;
  };
  const formatDate = (n) => {
    const date = new Date(n);
    return `${date.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric' })} ${date.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit', hour12: false })}`;
  };
  const catLabel = (category) => ({ added: 'Added', changed: 'Changed', fixed: 'Fixed' })[category] || '';
  const category = (r) => r.kind === 'handoff' ? null : (r.category || 'changed');
  function error(message = '') { $('error').textContent = message; }
  function showEditor(visible) {
    $('history').classList.toggle('hidden', visible);
    $('editor').classList.toggle('active', visible);
    deleting = null;
    error('');
  }
  function appendInline(target, raw) {
    const pattern = /\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)|\*\*([^*\n]+)\*\*|(https?:\/\/[^\s<>)]+)/gi;
    let cursor = 0;
    let match;
    while ((match = pattern.exec(raw)) !== null) {
      if (match.index > cursor) target.append(document.createTextNode(raw.slice(cursor, match.index)));
      if (match[1] && match[2]) {
        const a = tag('a', '', match[1]);
        a.href = match[2]; a.target = '_blank'; a.rel = 'noopener noreferrer'; target.append(a);
      } else if (match[3]) {
        target.append(tag('strong', '', match[3]));
      } else if (match[4]) {
        const href = match[4].replace(/[.,;!?]+$/, '');
        if (href) { const a = tag('a', '', href); a.href = href; a.target = '_blank'; a.rel = 'noopener noreferrer'; target.append(a); }
        if (href.length < match[4].length) target.append(document.createTextNode(match[4].slice(href.length)));
      }
      cursor = pattern.lastIndex;
    }
    if (cursor < raw.length) target.append(document.createTextNode(raw.slice(cursor)));
  }
  function renderMarkdown(raw) {
    // No HTML interpretation, no innerHTML: Markdown is converted to DOM text nodes and safe HTTP(S) anchors.
    const root = tag('div', 'markdown');
    let list = null;
    for (const line of String(raw).replace(/\r\n?/g, '\n').split('\n')) {
      const bullet = line.match(/^\s*[-*]\s+(.*)$/);
      const numbered = line.match(/^\s*(\d+)[.)]\s+(.*)$/);
      const kind = bullet ? 'ul' : numbered ? 'ol' : null;
      if (kind) {
        if (!list || list.tagName.toLowerCase() !== kind) { list = tag(kind); root.append(list); }
        const li = tag('li');
        appendInline(li, bullet ? bullet[1] : numbered[2]); list.append(li);
      } else {
        list = null;
        const paragraph = tag('p');
        appendInline(paragraph, line || ' '); root.append(paragraph);
      }
    }
    return root;
  }
  function renderList() {
    const query = $('search').value.trim().toLocaleLowerCase();
    const filter = $('typeFilter').value;
    const matching = records.filter(r => (filter === 'all' || (filter === 'handoff' ? r.kind === 'handoff' : category(r) === filter)) &&
      (!query || r.text.toLocaleLowerCase().includes(query) || r.authorName.toLocaleLowerCase().includes(query)));
    if (page * pageSize >= matching.length) page = Math.max(0, Math.ceil(matching.length / pageSize) - 1);
    const start = page * pageSize;
    const shown = matching.slice(start, start + pageSize);
    const root = $('list'); root.replaceChildren();
    $('total').textContent = `${records.length} записей`;
    $('counter').textContent = `Найдено: ${matching.length}`;
    if (!shown.length) root.append(tag('div', 'empty', 'Записей не найдено'));
    for (const rec of shown) {
      const card = tag('article', 'entry');
      const meta = tag('div', 'meta');
      meta.append(tag('span', 'author', rec.authorName), tag('span', 'secondary tiny timestamp', formatDate(rec.createdAt)));
      if (category(rec) !== 'changed' && category(rec) !== null) meta.append(tag('span', 'tag', catLabel(category(rec))));
      if (rec.kind === 'handoff') meta.append(tag('span', 'tag', 'Передано'));
      card.append(meta);
      if (rec.kind === 'handoff') card.append(tag('div', 'handoff', rec.text));
      else card.append(renderMarkdown(rec.text));
      const actions = tag('div', 'entry-actions');
      const editButton = tag('button', 'edit-link', 'Редактировать');
      editButton.type = 'button';
      editButton.disabled = pendingDelete;
      editButton.onclick = () => {
        deleting = null;
        editing = rec.id;
        originalText = rec.text;
        preventBlurSave = false;
        submitted = false;
        $('editText').value = rec.text;
        showEditor(true);
        $('editText').focus();
      };
      const deleteButton = tag('button', 'delete-link', 'Удалить');
      deleteButton.type = 'button';
      deleteButton.disabled = pendingDelete;
      deleteButton.onclick = () => {
        if (pendingDelete) return;
        deleting = rec.id;
        renderList();
      };
      actions.append(editButton, deleteButton);
      card.append(actions);
      if (deleting === rec.id) {
        const confirmation = tag('div', 'delete-confirmation');
        confirmation.setAttribute('role', 'group');
        confirmation.setAttribute('aria-label', 'Подтверждение удаления');
        confirmation.append(tag('span', '', 'Удалить запись?'));
        const cancel = tag('button', 'secondary-btn', 'Отмена');
        cancel.type = 'button';
        cancel.disabled = pendingDelete;
        cancel.onclick = () => {
          if (pendingDelete) return;
          deleting = null;
          renderList();
        };
        const confirm = tag('button', 'danger-primary', 'Удалить');
        confirm.type = 'button';
        confirm.disabled = pendingDelete;
        confirm.onclick = () => {
          if (pendingDelete || deleting !== rec.id) return;
          pendingDelete = true;
          renderList();
          send({ type: 'DELETE', id: rec.id });
        };
        confirmation.append(cancel, confirm);
        card.append(confirmation);
      }
      root.append(card);
    }
    const footer = $('pageFooter'); footer.replaceChildren();
    footer.append(tag('span', 'secondary tiny', `${matching.length ? start + 1 : 0}–${Math.min(start + pageSize, matching.length)} из ${matching.length}`));
    if (page > 0) {
      const prev = tag('button', 'secondary-btn', 'Назад'); prev.onclick = () => { if (!pendingDelete) deleting = null; page -= 1; renderList(); }; footer.append(prev);
    }
    if (start + pageSize < matching.length) {
      const next = tag('button', 'secondary-btn', 'Дальше'); next.onclick = () => { if (!pendingDelete) deleting = null; page += 1; renderList(); }; footer.append(next);
    }
  }
  $('close').onclick = () => send({ type: 'CLOSE' });
  $('search').oninput = () => { if (!pendingDelete) deleting = null; page = 0; renderList(); };
  $('typeFilter').onchange = () => { if (!pendingDelete) deleting = null; page = 0; renderList(); };
  function commitHistoryEdit() {
    if (preventBlurSave || pendingDelete || submitted || editing === null) return;
    const text = $('editText').value.trim();
    if (!text) { error('Текст записи не может быть пустым'); return; }
    if (text === originalText) { showEditor(false); editing = null; return; }
    submitted = true;
    send({ type: 'EDIT', id: editing, newText: text });
  }
  $('editText').onblur = commitHistoryEdit;
  $('editText').onkeydown = (event) => {
    if (event.key === 'Escape') {
      event.preventDefault();
      preventBlurSave = true;
      editing = null;
      editing = null;
      showEditor(false);
    }
  };
  // Prevent blur-autosave before pressing Cancel or Delete in the HTML editor.
  $('cancelEdit').onpointerdown = () => { preventBlurSave = true; };
  $('cancelEdit').onclick = () => {
    preventBlurSave = true;
    editing = null;
    showEditor(false);
  };
  window.onmessage = (event) => {
    const message = event.data && event.data.pluginMessage;
    if (!message || !message.type) return;
    if (message.type === 'STATE') {
      records = Array.isArray(message.records) ? message.records : [];
      renderList();
    } else if (message.type === 'ERROR') {
      submitted = false; pendingDelete = false;
      renderList();
      error(message.message || 'Ошибка сохранения');
    } else if (message.type === 'SAVED' && submitted) {
      submitted = false;
      editing = null;
      showEditor(false);
    } else if (message.type === 'DELETED' && pendingDelete && message.id === deleting) {
      pendingDelete = false;
      deleting = null;
    }
  };
  send({ type: 'REQUEST_STATE' });
})();
</script>
</body>
</html>
