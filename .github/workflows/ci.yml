name: Verify
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: design-history-log-test-${{ github.sha }}
          path: artifacts/Design-History-Log-v*-test.zip
          if-no-files-found: error
          retention-days: 14
